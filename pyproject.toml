[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matilda-platform-ha"
version = "1.0.0"
description = "Home Assistant integration for Matilda Platform school menus"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["homeassistant", "matilda", "platform", "school", "menu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

dependencies = [
    "aiohttp>=3.8.0",
    "voluptuous>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/matilda-platform-ha"
Documentation = "https://github.com/yourusername/matilda-platform-ha"
Repository = "https://github.com/yourusername/matilda-platform-ha.git"
"Issue Tracker" = "https://github.com/yourusername/matilda-platform-ha/issues"

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "--cov=custom_components/matilda_platform --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
